# 传感器在鞋垫上的物理坐标 (单位: cm)
sensors:
  - id: 0
    name: "Toe"
    x: 0.0
    y: 12.0
  - id: 1
    name: "Metatarsal_1"
    x: -2.5
    y: 8.0
  - id: 2
    name: "Metatarsal_5"
    x: 2.5
    y: 8.0
  - id: 3
    name: "Heel"
    x: 0.0
    y: 0.0

# 核心修改部分：匹配你的 Arduino 端口
serial:
  port: "COM3"      # 必须与 Arduino IDE 右下角显示的 COM3 一致
  baudrate: 115200  # 必须与 Arduino 代码中 Serial.begin(115200) 一致